[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
[project]
name = "constraintlab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0", "starlette==1.8.0"]
[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]
[project.scripts]
constraintlab = "constraintlab.cli:main"
[tool.setuptools.packages.find]
where = ["backend"]
include = ["constraintlab*"]
namespaces = false
