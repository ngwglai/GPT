<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e8d2">
  <title>局域网联机 · 青雀麻将 v1.2.0</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/table.css">
  <link rel="stylesheet" href="/v09.css"><link rel="stylesheet" href="/v091.css"><link rel="stylesheet" href="/v092.css"><link rel="stylesheet" href="/v093.css">
  <link rel="stylesheet" href="/lan.css">
  <link rel="stylesheet" href="/v094.css"><link rel="stylesheet" href="/v095.css">
</head>
<body class="lan-mode">
  <header class="topbar">
    <div class="brand">
      <a class="brand" href="/" aria-label="青雀麻将首页"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#bird"></use></svg></span><strong>青雀麻将</strong></a>
      <span class="mode-label">局域网联机</span>
    </div>
    <div id="tableHud" class="table-hud hidden" aria-label="本局信息"></div>
    <div class="round-controls">
      <span id="connectionStatus" class="connection-status" role="status">尚未连接</span>
      <button id="focusHand" type="button" class="ghost hidden">我的手牌</button>
      <button id="nextRound" type="button" class="primary hidden">准备下一局</button>
      <button id="leaveRoom" type="button" class="ghost quiet-danger hidden">离开</button>
      <details id="roomManagement" class="top-details hidden">
        <summary class="ghost">房间</summary>
        <div class="settings-panel room-management-panel">
          <button id="forceReconnect" type="button" class="ghost">强制重连</button>
          <button id="releaseRoom" type="button" class="ghost quiet-danger">退出并释放座位</button>
          <div id="hostManagement"></div>
        </div>
      </details>
      <details id="controlMenu" class="top-details hidden">
        <summary class="ghost">托管</summary>
        <div class="settings-panel" id="controlSettings"></div>
      </details>
      <details class="sound-settings top-details">
        <summary class="ghost"><svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#sound"></use></svg> 声音</summary>
        <div class="sound-panel settings-panel">
          <h2>声音设置</h2>
          <label><span><input id="bgmEnabled" type="checkbox"> BGM</span><input id="bgmVolume" aria-label="背景音乐音量" type="range" min="0" max="1" step="0.05"></label>
          <label><span><input id="sfxEnabled" type="checkbox"> 音效</span><input id="sfxVolume" aria-label="音效音量" type="range" min="0" max="1" step="0.05"></label>
          <label><span><input id="voiceEnabled" type="checkbox"> 语音</span><input id="voiceVolume" aria-label="语音音量" type="range" min="0" max="1" step="0.05"></label>
          <small>音量会保存在当前浏览器。点击页面后可播放背景音乐。</small>
        </div>
      </details>
    </div>
  </header>
  <main class="game-content">
    <div id="notice" class="notice hidden" role="alert"></div>
    <section id="joinPanel" class="lobby-card lobby-entry">
      <div class="lobby-art" role="img" aria-label="阳光下摆好麻将桌的茶室"></div>
      <div class="lobby-form">
        <span class="eyebrow"><i></i> 四人联机</span>
        <h1>局域网大厅</h1>
        <p>和同一网络里的好友围坐一桌。</p>
        <label for="nickname">你的昵称</label>
        <input id="nickname" maxlength="20" autocomplete="nickname" placeholder="输入昵称">
        <div class="join-actions">
          <label for="roomName">房间名称（创建时使用）</label>
          <input id="roomName" maxlength="40" placeholder="麻将房间">
          <label for="roomPassword">房间密码（公开房间留空）</label>
          <input id="roomPassword" type="password" maxlength="64" autocomplete="off" placeholder="可选">
          <label for="roomBaseScore">创建房间基础分</label>
          <select id="roomBaseScore"><option value="1">1 分</option><option value="5">5 分</option></select>
          <button id="createRoom" type="button" class="primary">创建房间 <svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#plus"></use></svg></button>
          <div class="join-divider"><span>已有房间号</span></div>
          <div class="join-code">
            <input id="roomCode" maxlength="6" placeholder="六位房间号" aria-label="房间号" autocapitalize="characters" autocomplete="off" spellcheck="false">
            <button id="joinRoom" type="button" class="ghost">加入房间</button>
          </div>
        </div>
        <section class="public-rooms" aria-label="公开房间列表">
          <div class="room-list-heading"><h2>公开房间</h2><button id="refreshRooms" type="button" class="ghost">刷新</button></div>
          <p id="lobbyStatus" class="subtle" role="status">正在读取大厅…</p>
          <div id="publicRooms"></div>
        </section>
        <button id="resumeRoom" type="button" class="ghost hidden">返回原房间</button>
        <p class="subtle">短暂断线或刷新后会自动恢复座位。每名玩家使用自己的浏览器。</p>
      </div>
    </section>
    <section id="roomPanel" class="lobby-card room-card hidden">
      <div class="room-heading">
        <div><span class="eyebrow"><i></i> 房间号</span><h1 id="roomTitle"></h1><p id="roomDisplayName" class="subtle"></p><p id="roomScoreMode" class="subtle"></p></div>
        <span id="yourSeat" class="badge self"></span>
      </div>
      <div id="roster" class="roster" aria-label="玩家席位"></div>
      <div id="waitingControls" class="room-controls">
        <p id="waitingHint" class="subtle" role="status"></p>
        <button id="startGame" type="button" class="primary">房主开始游戏</button>
        <button id="startAI" type="button" class="ghost">空位由 AI 补齐并开始</button>
      </div>
    </section>
    <section id="gameTable" class="table-shell hidden" aria-label="四家牌桌">
      <article id="seat-3" class="player north"></article>
      <article id="seat-0" class="player east"></article>
      <section id="center" class="center-board" aria-label="中央牌桌"></section>
      <div id="sceneToolbar" class="scene-toolbar"></div>
      <article id="seat-2" class="player west"></article>
      <article id="seat-1" class="player south"></article>
    </section>
    <p id="playingHint" class="subtle hidden">暂离保留座位；释放座位后可由新玩家接管。全员离线时自动暂停。</p>
  </main>
  <script src="/presentation.js"></script>
  <script src="/components.js"></script>
  <script src="/perspective.js"></script><script src="/table-scene.js"></script>
  <script src="/cuboid-scene.js"></script>
  <script src="/app.js"></script>
  <script src="/lan.js"></script>
</body>
</html>
