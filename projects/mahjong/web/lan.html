<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网麻将 · v0.5.0</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/lan.css"></head>
<body class="lan-mode">
<header class="topbar"><div class="brand"><strong>局域网麻将</strong><span id="connectionStatus" role="status">尚未连接</span></div><div class="round-controls"><a href="/">首页</a><button id="focusHand" class="ghost hidden">我的手牌</button><button id="nextRound" class="primary hidden">下一局</button><button id="leaveRoom" class="ghost hidden">离开房间</button><details class="sound-settings"><summary>声音</summary><div class="sound-panel"><label><span><input id="bgmEnabled" type="checkbox"> BGM</span><input id="bgmVolume" type="range" min="0" max="1" step="0.05"></label><label><span><input id="sfxEnabled" type="checkbox"> 音效</span><input id="sfxVolume" type="range" min="0" max="1" step="0.05"></label><label><span><input id="voiceEnabled" type="checkbox"> 语音</span><input id="voiceVolume" type="range" min="0" max="1" step="0.05"></label><small>可以使用原有素材映射；当前尚未加入音频。</small></div></details></div></header>
<main><div id="notice" class="notice hidden" role="alert"></div>
<section id="joinPanel" class="lobby-card"><span class="eyebrow">同一个 Wi-Fi，一起开局</span><h1>加入一桌麻将</h1><label for="nickname">你的昵称</label><input id="nickname" maxlength="20" autocomplete="nickname" placeholder="输入昵称"><div class="join-actions"><button id="createRoom" class="primary">创建房间</button><span>或</span><input id="roomCode" maxlength="6" placeholder="六位房间号" aria-label="房间号" autocapitalize="characters"><button id="joinRoom" class="ghost">加入房间</button></div><button id="resumeRoom" class="ghost hidden">返回原房间</button><p class="subtle">刷新或短暂断线后会自动回到原座位。每名玩家使用自己的浏览器。</p></section>
<section id="roomPanel" class="lobby-card hidden"><div class="room-heading"><div><span class="eyebrow">房间号</span><h1 id="roomTitle"></h1></div><span id="yourSeat"></span></div><div id="roster" class="roster"></div><div id="waitingControls"><p id="waitingHint"></p><button id="startGame" class="primary">房主开始游戏</button></div><p id="playingHint" class="subtle hidden">开始后座位固定；掉线不会自动出牌。需要响应时请自行选择吃、碰、杠、胡或过。</p></section>
<section id="gameTable" class="table-shell hidden"><article id="seat-3" class="player north"></article><article id="seat-0" class="player east"></article><section id="center" class="center-board"></section><article id="seat-2" class="player west"></article><article id="seat-1" class="player south"></article></section>
</main><script src="/presentation.js"></script><script src="/app.js"></script><script src="/lan.js"></script></body>
</html>
