<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>青雀麻将 · 春樱牌桌 v1.1.2</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/modern-ui.css">
  <link rel="stylesheet" href="/v09.css"><link rel="stylesheet" href="/v091.css"><link rel="stylesheet" href="/v092.css">
</head>
<body class="home" data-art-preview>
  <header class="topbar">
    <a class="brand" href="/" aria-current="page">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#bird"></use></svg></span>
      <strong>青雀麻将</strong>
    </a>
    <nav aria-label="主导航"><a class="nav-link" href="/asset-gallery.html">美术图鉴</a></nav>
  </header>
  <main class="home-content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <span class="eyebrow"><i></i> 本地麻将 <span class="hero-version">v1.1.2</span></span>
        <h1 id="hero-title">青雀麻将</h1>
        <p>在同一个 Wi-Fi 里约上三位好友，或独自执四家熟悉牌路。</p>
        <div class="hero-actions">
          <a class="primary" href="/lan.html">开启联机 <svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#arrow"></use></svg></a>
          <a class="ghost" href="/local.html">单机练习</a>
        </div>
      </div>
    </section>
    <section class="mode-section" aria-labelledby="mode-title">
      <h2 id="mode-title">选择玩法</h2>
      <div class="entry-grid">
        <a class="entry-card" href="/lan.html">
          <span class="entry-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#people"></use></svg></span>
          <div><h3>局域网联机</h3><p>四人各执一手。分享房间号，入座后由房主开局。</p></div>
          <svg class="icon entry-arrow" aria-hidden="true"><use href="/assets/icons/marks.svg#arrow"></use></svg>
        </a>
        <a class="entry-card" href="/local.html">
          <span class="entry-icon alt"><svg class="icon" aria-hidden="true"><use href="/assets/icons/marks.svg#tiles"></use></svg></span>
          <div><h3>单机练习</h3><p>在服务器本机明牌练习。可指定庄家和种子复盘。</p></div>
          <svg class="icon entry-arrow" aria-hidden="true"><use href="/assets/icons/marks.svg#arrow"></use></svg>
        </a>
      </div>
    </section>
    <section class="guide-grid" aria-label="游玩说明">
      <article><h2>如何联机</h2><p>一台电脑启动服务器，其他设备在同一网络打开主机的局域网地址。房间内刷新可恢复座位，服务器重启后房间将清空。</p></article>
      <article><h2>本地牌规</h2><p>掷骰定开牌位，金牌与金指示牌在发牌时公开。可报听、上金，也可在规则允许时拾幺牌进入十三幺路线。</p></article>
    </section>
  </main>
  <script src="/presentation.js"></script>
