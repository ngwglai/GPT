[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope"
version = "0.1.0"
description = "Offline repository analysis and self-contained reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pathspec==0.12.1"]

[project.scripts]
reposcope = "reposcope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
