<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="深井协议：免费单人卡组肉鸽。三种职业、分支路线与随机冒险。">
<meta name="theme-color" content="#09121e">
<title>深井协议 · RogueLab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#e8f2f1;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-content:center}#game{position:relative;width:min(100vw,160vh);aspect-ratio:8/5}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#09121e;padding:2rem}h1{letter-spacing:.18em;color:#72e9bf}progress{width:100%;accent-color:#72e9bf}#notice{max-width:38rem;white-space:pre-wrap;color:#ff987b}.links{position:fixed;bottom:4px;right:12px;font-size:11px;opacity:.7}.links a{color:#94acbd}#rotate{display:none}@media(orientation:portrait){#rotate{display:block;text-align:center;color:#94acbd;font-size:13px;padding:12px}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="game" aria-label="深井协议游戏">
<canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="回合制卡牌游戏。鼠标或数字键出牌，方向键选敌人，空格结束回合，H 用药剂，Esc 返回菜单。">请使用支持画布功能的浏览器。</canvas>
<div id="status" role="status"><h1>ROGUELAB</h1><p>深井协议</p><p id="notice">正在准备下潜……</p><progress id="progress"></progress></div>
</main>
<div id="rotate">为清楚阅读卡牌，请使用电脑或将设备转为横屏。</div>
<nav class="links"><a href="https://github.com/ngwglai/GPT/releases/tag/roguelab-v1.1.0">下载 Windows 版</a> · <a href="https://github.com/ngwglai/GPT/tree/main/projects/roguelab">源码与中文说明</a></nav>
<noscript>游戏需要启用 JavaScript 和 WebGL 2。</noscript>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const notice = document.getElementById('notice');
const progress = document.getElementById('progress');
const missing = Engine.getMissingFeatures({threads: false});
if(missing.length){notice.textContent='浏览器缺少必要功能，请启用 WebGL 2 或更换浏览器。';progress.hidden=true;}
else engine.startGame({onProgress:(current,total)=>{if(total){progress.max=total;progress.value=current;notice.textContent='正在加载远征 '+Math.round(100*current/total)+'%';}}}).then(()=>{document.getElementById('status').remove();document.getElementById('canvas').focus();}).catch(error=>{notice.textContent='启动失败，请刷新页面，或使用已启用 WebGL 2 的浏览器。';progress.hidden=true;});
</script>
</body>
</html>
