<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="RogueLab: Deepwell Protocol. A free tactical deckbuilding roguelike built in Godot 4. Three operators, branching expeditions, one life.">
<meta name="theme-color" content="#09121e">
<title>RogueLab · Deepwell Protocol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#e8f2f1;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-content:center}#game{position:relative;width:min(100vw,160vh);aspect-ratio:8/5}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#09121e;padding:2rem}h1{letter-spacing:.18em;color:#72e9bf}progress{width:100%;accent-color:#72e9bf}#notice{max-width:38rem;white-space:pre-wrap;color:#ff987b}.links{position:fixed;bottom:4px;right:12px;font-size:11px;opacity:.7}.links a{color:#94acbd}#rotate{display:none}@media(orientation:portrait){#rotate{display:block;text-align:center;color:#94acbd;font-size:13px;padding:12px}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="game" aria-label="RogueLab game">
<canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="Tactical card game. Use mouse, keys 1 to 9 to play cards, arrows to select enemies, space to end turn, H to heal, Escape for menu.">Your browser needs canvas support.</canvas>
<div id="status" role="status"><h1>ROGUELAB</h1><p>DEEPWELL PROTOCOL</p><p id="notice">Preparing the descent…</p><progress id="progress"></progress></div>
</main>
<div id="rotate">For readable cards, use a desktop or rotate your device to landscape.</div>
<nav class="links"><a href="https://github.com/ngwglai/GPT/releases/tag/roguelab-v1.0.0">Windows download</a> · <a href="https://github.com/ngwglai/GPT/tree/main/projects/roguelab">Source &amp; 中文说明</a></nav>
<noscript>This game requires JavaScript and WebGL 2.</noscript>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const notice = document.getElementById('notice');
const progress = document.getElementById('progress');
const missing = Engine.getMissingFeatures({threads: false});
if(missing.length){notice.textContent='This browser cannot start the game: '+missing.join(', ');progress.hidden=true;}
else engine.startGame({onProgress:(current,total)=>{if(total){progress.max=total;progress.value=current;notice.textContent='Loading expedition '+Math.round(100*current/total)+'%';}}}).then(()=>{document.getElementById('status').remove();document.getElementById('canvas').focus();}).catch(error=>{notice.textContent='Unable to start. Reload, or try a browser with WebGL 2 enabled. '+error.message;progress.hidden=true;});
</script>
</body>
</html>
