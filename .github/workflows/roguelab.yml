name: RogueLab

on:
  pull_request:
    paths: ['projects/roguelab/**', '.github/workflows/roguelab.yml', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['projects/roguelab/**', '.github/workflows/roguelab.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roguelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: RogueLab rules, browser and exports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/roguelab-tools
          key: roguelab-godot-4.6.3-${{ runner.os }}-v1
      - name: Install checksum-verified Godot and export templates
        run: python projects/roguelab/tools/setup_godot.py --directory "$RUNNER_TEMP/roguelab-tools" --templates
      - name: Rules, UI screens, seeded expeditions and both exports
        run: python projects/roguelab/tools/verify.py --export
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Play the actual Web export
        run: python projects/roguelab/tests/web_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roguelab-web
          path: projects/roguelab/build/web/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roguelab-windows
          path: projects/roguelab/build/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: roguelab-browser-evidence
          path: projects/roguelab/test-results/

  windows:
    name: RogueLab Windows native validation
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install verified native Godot
        run: python projects/roguelab/tools/setup_godot.py --directory "$env:RUNNER_TEMP/roguelab-tools"
      - name: Run native rules and UI checks
        run: python projects/roguelab/tools/verify.py --godot godot_console.exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: roguelab-windows
          path: exported
      - name: Launch the exported Windows executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./exported/RogueLab.exe -ArgumentList '--headless', '--', '--smoke' -Wait -PassThru -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-error.txt
          Get-Content smoke.txt
          Get-Content smoke-error.txt
          if ($process.ExitCode -ne 0) { throw 'Exported game failed' }
          if (-not (Select-String -Path smoke.txt -Pattern 'ROGUELAB_EXPORT_SMOKE_PASS')) { throw 'Export smoke marker missing' }
          if (Select-String -Path smoke-error.txt -Pattern 'ERROR') { throw 'Export logged an error' }

  release:
    name: Publish RogueLab downloads
    needs: [build, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: roguelab-windows
          path: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: roguelab-web
          path: web
      - name: Package reproducible deliverables
        run: |
          cp projects/roguelab/README.md windows/README.md
          cp projects/roguelab/LICENSE windows/LICENSE
          cp projects/roguelab/THIRD_PARTY.md windows/THIRD_PARTY.md
          cd windows
          zip -r ../RogueLab-windows-x86_64.zip .
          cd ../web
          zip -r ../RogueLab-web.zip .
          cd ..
          sha256sum RogueLab-windows-x86_64.zip RogueLab-web.zip > SHA256SUMS.txt
      - name: Publish version once; never replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view roguelab-v1.0.0 >/dev/null 2>&1; then
            echo 'Version already published; bump the version for a new release.'
          else
            gh release create roguelab-v1.0.0 --target "$GITHUB_SHA" --title 'RogueLab v1.0.0 — Deepwell Protocol' --notes-file projects/roguelab/RELEASE.md RogueLab-windows-x86_64.zip RogueLab-web.zip SHA256SUMS.txt
          fi
