name: Publish verified Mahjong v0.10.1 binaries

on:
  workflow_dispatch:
  push:
    branches: [release/qingque-v0.10.1-publish]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/release/qingque-v0.10.1-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ngwglai/GPT
      CI_RUN: '45520641374'
      INPUT_SHA: a99f76b4dd23c1a7cd6dfe1da3a60cf80de0eef8
      MERGE_SHA: 56345725dd09f2904cb726c1c1b43a725884042f
      TAG: mahjong-v0.10.1
      RELEASE_ID: '457515138'
      WINDOWS_ZIP_SHA: 20d5b082652f97b3d0a910f159915255beee22a84a36f8024fd209737569e5ef
    steps:
      - name: Verify immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$(gh run view "$CI_RUN" -R "$REPOSITORY" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$INPUT_SHA success"
          tag_object=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq '.object.sha')" = "$MERGE_SHA"
          test "$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID" --jq '.tag_name + " " + (.draft|tostring)')" = "$TAG true"
      - name: Download and verify the native Windows CI package
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$CI_RUN" -R "$REPOSITORY" --name mahjong-windows-portable --dir portable
          gh run download "$CI_RUN" -R "$REPOSITORY" --name mahjong-validation-ubuntu-latest --dir linux
          cd portable
          printf '%s  %s\n' "$WINDOWS_ZIP_SHA" QingqueMahjong_v0.10.1.zip | sha256sum -c
          sha256sum -c QingqueMahjong_v0.10.1.sha256
          unzip -tq QingqueMahjong_v0.10.1.zip
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          release = Path(".")
          linux = Path("../linux")
          prefix = "QingqueMahjong_v0.10.1/validation/v0.10.1/"
          data = {
              "workflow": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['CI_RUN']}",
              "head_sha": os.environ["INPUT_SHA"],
          }
          for filename, key in (
              ("ci-performance.json", "linux_performance"),
              ("ci-soak.json", "linux_frozen"),
              ("ci-tabs.json", "linux_active_tabs"),
          ):
              data[key] = json.loads((linux / filename).read_text(encoding="utf-8"))
          with zipfile.ZipFile(release / "QingqueMahjong_v0.10.1.zip") as archive:
              screenshot = archive.read(prefix + "windows-browser/04-local-dealt.png")
              assert screenshot.startswith(b"\x89PNG\r\n\x1a\n")
              (release / "QingqueMahjong_v0.10.1_Windows.png").write_bytes(screenshot)
              data["windows_performance"] = json.loads(archive.read(prefix + "ci-performance.json"))
          assert not data["linux_performance"]["failures"]
          assert not data["windows_performance"]["failures"]
          (release / "QingqueMahjong_v0.10.1_CI.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload, verify GitHub asset digests, and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" -R "$REPOSITORY" portable/QingqueMahjong_v0.10.1*
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID/assets" > release-assets.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          assets = {a["name"]: a for a in json.loads(Path("release-assets.json").read_text())}
          for path in Path("portable").glob("QingqueMahjong_v0.10.1*"):
              asset = assets[path.name]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert asset["state"] == "uploaded", path.name
              assert asset["size"] == path.stat().st_size, path.name
              assert asset["digest"] == f"sha256:{digest}", path.name
          assert len(assets) == 4, list(assets)
          PY
          gh release edit "$TAG" -R "$REPOSITORY" --draft=false --latest=false
          test "$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" = false
