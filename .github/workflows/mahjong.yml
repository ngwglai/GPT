name: Mahjong

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Mahjong (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/mahjong
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip install playwright==1.62.0
          python -m pip check
          npm install --no-package-lock
      - name: Full Python suite, orphan pickup and gold compatibility
        run: |
          python -m unittest discover -v
          python -m unittest discover -v -k orphan_pickup
          python -m unittest -v tests.test_gold tests.test_win
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/lan.js
          node --check web/presentation.js
          node --check web/components.js
          node --check web/table-scene.js
          node --check web/table-mesh.js
          node --check tests/ui_smoke.cjs
      - name: Read project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Mahjong project version could not be read' }
          "MAHJONG_VERSION=$version" >> $env:GITHUB_ENV
      - name: Frontend integration
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList 'web_server.py', '--no-browser' -PassThru -NoNewWindow
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40 -and -not $health; $attempt++) {
              if ($server.HasExited) { throw "Web server exited with code $($server.ExitCode)" }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $health.ok -or $health.version -ne $env:MAHJONG_VERSION) { throw 'Mahjong health check failed' }
            npm run test:ui -- http://127.0.0.1:8765
            if ($LASTEXITCODE -ne 0) { throw 'Frontend integration failed' }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
              $server.WaitForExit()
            }
          }
      - name: Chromium acceptance (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m tests.browser_acceptance --chromium /usr/bin/google-chrome
          python -m tests.wall_browser_acceptance --chromium /usr/bin/google-chrome
      - name: Chromium acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          python -m tests.browser_acceptance --chromium $chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.wall_browser_acceptance --chromium $chrome
      - name: Windows batch launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launchers = [ordered]@{
            'start_web.bat' = '127.0.0.1'
            '启动网页版.bat' = '127.0.0.1'
            'start_lan.bat' = '0.0.0.0'
            '启动局域网联机.bat' = '0.0.0.0'
          }
          foreach ($entry in $launchers.GetEnumerator()) {
            $server = Start-Process cmd.exe -ArgumentList @('/d', '/c', 'call', $entry.Key) -PassThru -NoNewWindow
            try {
              $health = $null
              for ($attempt = 0; $attempt -lt 120 -and -not $health; $attempt++) {
                if ($server.HasExited) { throw "$($entry.Key) exited with code $($server.ExitCode)" }
                try {
                  $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              }
              if (-not $health.ok -or $health.version -ne $env:MAHJONG_VERSION) { throw "$($entry.Key) failed its health check" }
              $listeners = Get-NetTCPConnection -State Listen -LocalPort 8765
              if ($entry.Value -notin $listeners.LocalAddress) { throw "$($entry.Key) bound to the wrong address" }
              Write-Host "$($entry.Key) served v$env:MAHJONG_VERSION on $($entry.Value)"
            } finally {
              if (-not $server.HasExited) {
                taskkill.exe /PID $server.Id /T /F
                if ($LASTEXITCODE -ne 0) { throw "Failed to stop $($entry.Key)" }
                $server.WaitForExit()
              }
            }
          }
