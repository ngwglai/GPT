name: Mahjong

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Mahjong (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      # Source files and SVGs are UTF-8; don't inherit the Windows legacy code page.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/mahjong
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip install playwright==1.62.0
          python -m pip check
          npm install --no-package-lock
      - name: Full Python suite, orphan pickup and gold compatibility
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw "Full Python suite failed with exit code $LASTEXITCODE" }
          python -m unittest discover -v -k orphan_pickup
          if ($LASTEXITCODE -ne 0) { throw "Orphan pickup suite failed with exit code $LASTEXITCODE" }
          python -m unittest -v tests.test_gold tests.test_win
          if ($LASTEXITCODE -ne 0) { throw "Gold compatibility suite failed with exit code $LASTEXITCODE" }
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/lan.js
          node --check web/presentation.js
          node --check web/components.js
          node --check web/table-scene.js
          node --check web/cuboid-scene.js
          node --check web/perspective.js
          node --check tests/ui_smoke.cjs
      - name: Geometry and special layout regressions
        run: |
          node tests/v092_scene_logic.cjs
          node tests/v093_projection.cjs
          node tests/v094_cuboid.cjs
          node tests/v095_fit.cjs
          node tests/v098_perspective.cjs
          node tests/v101_texture.cjs
      - name: Read project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Mahjong project version could not be read' }
          "MAHJONG_VERSION=$version" >> $env:GITHUB_ENV
      - name: Frontend integration
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList 'web_server.py', '--no-browser' -PassThru -NoNewWindow
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40 -and -not $health; $attempt++) {
              if ($server.HasExited) { throw "Web server exited with code $($server.ExitCode)" }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $health.ok -or $health.version -ne $env:MAHJONG_VERSION) { throw 'Mahjong health check failed' }
            npm run test:ui -- http://127.0.0.1:8765
            if ($LASTEXITCODE -ne 0) { throw 'Frontend integration failed' }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
              $server.WaitForExit()
            }
          }
      - name: Chromium acceptance (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m tests.browser_acceptance --chromium /usr/bin/google-chrome
          python -m tests.v101_scene_acceptance --chromium /usr/bin/google-chrome
          python -m tests.scoring_browser_acceptance --chromium /usr/bin/google-chrome
          python tools/performance_regression.py --chromium /usr/bin/google-chrome --samples 1 --iterations 24 --output validation/v1.0.0/ci-performance.json
          python -m tests.soak_acceptance --chromium /usr/bin/google-chrome --rounds 4 --output validation/v1.0.0/ci-soak.json
          python -m tests.soak_acceptance --chromium /usr/bin/google-chrome --foreground --delay .12 --rounds 2 --output validation/v1.0.0/ci-tabs.json
      - name: Chromium acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          python -m tests.browser_acceptance --chromium $chrome --screenshots validation/v1.0.0/windows-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.v101_scene_acceptance --chromium $chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.scoring_browser_acceptance --chromium $chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/performance_regression.py --chromium $chrome --samples 1 --iterations 24 --viewports desktop,phone-landscape --output validation/v1.0.0/ci-performance.json
      - name: Windows batch launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Stop-MahjongTestServer {
            param([System.Diagnostics.Process]$Launcher)

            # A .bat process can exit before its Python child. Stop the process
            # that owns the listening socket first, then the cmd.exe wrapper.
            $listenerIds = @(
              Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty OwningProcess -Unique
            )
            foreach ($listenerId in $listenerIds) {
              if ($listenerId -and $listenerId -ne $PID) {
                Stop-Process -Id $listenerId -Force -ErrorAction SilentlyContinue
              }
            }

            try {
              $Launcher.Refresh()
              if (-not $Launcher.HasExited) {
                Stop-Process -Id $Launcher.Id -Force -ErrorAction SilentlyContinue
              }
            } catch {
              # The launcher may already have exited during child shutdown.
            }

            $deadline = [DateTime]::UtcNow.AddSeconds(5)
            do {
              Start-Sleep -Milliseconds 100
              $remaining = @(
                Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue
              )
            } while ($remaining.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline)

            if ($remaining.Count -gt 0) {
              $remainingIds = ($remaining | Select-Object -ExpandProperty OwningProcess -Unique) -join ', '
              throw "Port 8765 remained occupied after launcher cleanup (PID: $remainingIds)"
            }
          }

          $launchers = [ordered]@{
            'start_web.bat' = '127.0.0.1'
            '启动网页版.bat' = '127.0.0.1'
            'start_lan.bat' = '0.0.0.0'
            '启动局域网联机.bat' = '0.0.0.0'
          }
          foreach ($entry in $launchers.GetEnumerator()) {
            $server = Start-Process cmd.exe -ArgumentList @('/d', '/c', 'call', $entry.Key) -PassThru -NoNewWindow
            try {
              $health = $null
              for ($attempt = 0; $attempt -lt 120 -and -not $health; $attempt++) {
                if ($server.HasExited) { throw "$($entry.Key) exited with code $($server.ExitCode)" }
                try {
                  $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              }
              if (-not $health.ok -or $health.version -ne $env:MAHJONG_VERSION) { throw "$($entry.Key) failed its health check" }
              $listeners = Get-NetTCPConnection -State Listen -LocalPort 8765
              if ($entry.Value -notin $listeners.LocalAddress) { throw "$($entry.Key) bound to the wrong address" }
              Write-Host "$($entry.Key) served v$env:MAHJONG_VERSION on $($entry.Value)"
            } finally {
              Stop-MahjongTestServer -Launcher $server
            }
          }
      - name: Windows portable build and embedded runtime test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "QingqueMahjong_v${env:MAHJONG_VERSION}.zip"
          python tools/package_release.py --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
          $folder = Join-Path $env:RUNNER_TEMP 'mahjong portable 中文'
          Expand-Archive $archive $folder
          $project = Join-Path $folder "QingqueMahjong_v$env:MAHJONG_VERSION"
          $embedded = Join-Path $project 'runtime/python.exe'
          Push-Location $project
          try {
            & $embedded -m unittest -v tests.test_wall tests.test_gold tests.test_controllers
            if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime rules failed' }
            $server = Start-Process cmd.exe -ArgumentList @('/d','/c','call','start_web.bat') -PassThru -NoNewWindow
            try {
              $health = $null
              for ($attempt=0; $attempt -lt 80 -and -not $health; $attempt++) {
                if ($server.HasExited) { throw 'Portable launcher exited' }
                try { $health=Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2 }
                catch { Start-Sleep -Milliseconds 250 }
              }
              if ($health.version -ne $env:MAHJONG_VERSION) { throw 'Portable health failed' }
              $state = (Invoke-RestMethod http://127.0.0.1:8765/api/table).table
              $body = @{seat=$state.dealer;round_id=$state.round_id;revision=$state.revision;type='ROLL_DICE';tile_ids=@()} | ConvertTo-Json
              $dealt = Invoke-RestMethod http://127.0.0.1:8765/api/action -Method Post -ContentType 'application/json' -Body $body
              if ($dealt.table.phase -eq 'ROLLING_DICE') { throw 'Portable deal failed' }
            } finally {
              # The portable launcher has the same cmd.exe -> Python process
              # shape; clean up the socket owner even if cmd.exe exited first.
              $listenerIds = @(
                Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty OwningProcess -Unique
              )
              foreach ($listenerId in $listenerIds) {
                if ($listenerId -and $listenerId -ne $PID) {
                  Stop-Process -Id $listenerId -Force -ErrorAction SilentlyContinue
                }
              }
              try {
                $server.Refresh()
                if (-not $server.HasExited) {
                  Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
                }
              } catch {
                # The portable launcher may already have exited.
              }
              $deadline = [DateTime]::UtcNow.AddSeconds(5)
              do {
                Start-Sleep -Milliseconds 100
                $remaining = @(
                  Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue
                )
              } while ($remaining.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline)
              if ($remaining.Count -gt 0) {
                $remainingIds = ($remaining | Select-Object -ExpandProperty OwningProcess -Unique) -join ', '
                throw "Portable launcher left port 8765 occupied (PID: $remainingIds)"
              }
            }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mahjong-validation-${{ matrix.os }}
          path: |
            projects/mahjong/validation/v1.0.0/ci-*.json
            projects/mahjong/validation/v1.0.0/windows-browser/*.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: mahjong-windows-portable
          path: |
            ${{ runner.temp }}/QingqueMahjong_v${{ env.MAHJONG_VERSION }}.zip
            ${{ runner.temp }}/QingqueMahjong_v${{ env.MAHJONG_VERSION }}.sha256
