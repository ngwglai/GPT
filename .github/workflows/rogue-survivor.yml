name: RogueSurvivor
on:
  workflow_call:
    inputs:
      full_simulations:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_simulations:
        description: '执行原有完整平衡与120分钟压力模拟（耗时）'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: RogueSurvivor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/RogueSurvivor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/RogueSurvivor/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run simulate:economy
      - run: npm run simulate:builds
      - run: npm run build
      - run: npm run simulate
        if: inputs.full_simulations
      - run: npm run simulate:worlds
        if: inputs.full_simulations
      - run: npm run simulate -- --stress
        if: inputs.full_simulations
  browser:
    name: RogueSurvivor browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || null }}
    # Existing regression plus mobile viewports, multi-touch and complete menus.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/RogueSurvivor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/RogueSurvivor/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: rogue-survivor-failure-${{ matrix.os }}
          path: projects/RogueSurvivor/test-results

  mobile-webkit:
    name: RogueSurvivor mobile (WebKit)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/RogueSurvivor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/RogueSurvivor/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npm run test:mobile:webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: rogue-survivor-mobile-webkit-failure
          path: projects/RogueSurvivor/test-results
