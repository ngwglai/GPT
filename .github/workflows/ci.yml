name: CI

on:
  pull_request:
  push:
    branches: [main, feature/constraintlab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.detect.outputs.all }}
      reposcope: ${{ steps.detect.outputs.reposcope }}
      constraintlab: ${{ steps.detect.outputs.constraintlab }}
      qq_mail_mcp: ${{ steps.detect.outputs.qq_mail_mcp }}
      entropylab: ${{ steps.detect.outputs.entropylab }}
      compressionlab: ${{ steps.detect.outputs.compressionlab }}
      matchuplab: ${{ steps.detect.outputs.matchuplab }}
      causallab: ${{ steps.detect.outputs.causallab }}
      modelchecklab: ${{ steps.detect.outputs.modelchecklab }}
      synthlab: ${{ steps.detect.outputs.synthlab }}
      adversarylab: ${{ steps.detect.outputs.adversarylab }}
      deltalab: ${{ steps.detect.outputs.deltalab }}
      agenttrustlab: ${{ steps.detect.outputs.agenttrustlab }}
      calibrationlab: ${{ steps.detect.outputs.calibrationlab }}
      compilerlab: ${{ steps.detect.outputs.compilerlab }}
      rogue_survivor: ${{ steps.detect.outputs.rogue_survivor }}
      mahjong: ${{ steps.detect.outputs.mahjong }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Detect changed project scopes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_changed_projects.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  privacy:
    name: Privacy and identity (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Configure verified public identity policy
        # Confirmed using configure_git_identity.py and the owner's email API.
        # Public rules only: never inject the owner's private list into PR jobs.
        run: |
          git config --local privacy.name ngwglai
          git config --local privacy.email 232161468+ngwglai@users.noreply.github.com
      - run: python -m unittest discover -s tests -v
      - name: Check reachable commits and tracked content
        run: python scripts/privacy_check.py --all-history

  reposcope:
    name: RepoScope (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.reposcope == 'true'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.1.0
      - run: python -m pip install ./projects/reposcope build==1.6.1 ruff==0.17.0 pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit --local --skip-editable
      - run: ruff check --select F projects/reposcope scripts tests
      - run: python -m unittest discover -s projects/reposcope/tests -v
      - run: python -m build --wheel --outdir wheelhouse projects/reposcope
      - run: reposcope projects/reposcope --output smoke-report

  layout:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      constraintlab: ${{ steps.project.outputs.constraintlab }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        shell: bash
        run: |
          if test -f projects/constraintlab/pyproject.toml; then
            echo 'constraintlab=true' >> "$GITHUB_OUTPUT"
          else
            echo 'constraintlab=false' >> "$GITHUB_OUTPUT"
          fi

  constraintlab:
    name: ConstraintLab (${{ matrix.os }})
    needs: [layout, changes]
    if: needs.layout.outputs.constraintlab == 'true' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.constraintlab == 'true')
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/constraintlab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/constraintlab/frontend/package-lock.json
      - name: Check Python SSL
        run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.1.0
      - run: python -m pip install -e '.[test]' build==1.6.1 ruff==0.17.0 pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit --local --skip-editable
      - run: ruff check --select F backend docs/benchmark.py
      - run: python -m pytest backend/tests -q
      - run: python -m build --wheel --outdir wheelhouse
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npm --prefix frontend run build
      - name: Install Chromium and system dependencies
        if: runner.os == 'Linux'
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx --prefix frontend playwright install chromium
      - name: Browser acceptance
        if: runner.os != 'Windows'
        run: python ../../scripts/ci_constraintlab_e2e.py
      - name: Native Windows launcher and browser acceptance
        if: runner.os == 'Windows'
        run: python ../../scripts/ci_constraintlab_e2e.py --windows-launcher
      - run: python docs/benchmark.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: constraintlab-failure-${{ matrix.os }}
          path: |
            projects/constraintlab/frontend/test-results
            projects/constraintlab/server.log

  qq-mail-mcp:
    name: QQ Mail MCP
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.qq_mail_mcp == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/qq-mail-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the current checkout for Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/qq-mail-mcp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Install browser for OAuth consent regression
        run: npx playwright-core install chromium
      - name: Resolve installed Chromium path
        run: node --input-type=module -e "import {chromium} from 'playwright-core'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\n')"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run privacy

  entropylab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.entropylab == 'true'
    name: EntropyLab
    uses: ./.github/workflows/entropylab.yml

  compressionlab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.compressionlab == 'true'
    name: CompressionLab
    uses: ./.github/workflows/compressionlab.yml

  matchuplab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.matchuplab == 'true'
    name: MatchupLab
    uses: ./.github/workflows/matchuplab.yml

  causallab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.causallab == 'true'
    name: CausalLab
    uses: ./.github/workflows/causallab.yml

  modelchecklab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.modelchecklab == 'true'
    name: ModelCheckLab
    uses: ./.github/workflows/modelchecklab.yml

  synthlab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.synthlab == 'true'
    name: SynthLab
    uses: ./.github/workflows/synthlab.yml

  adversarylab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.adversarylab == 'true'
    name: AdversaryLab
    uses: ./.github/workflows/adversarylab.yml

  deltalab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.deltalab == 'true'
    name: DeltaLab
    uses: ./.github/workflows/deltalab.yml

  agenttrustlab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.agenttrustlab == 'true'
    name: AgentTrustLab
    uses: ./.github/workflows/agenttrustlab.yml

  calibrationlab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.calibrationlab == 'true'
    name: CalibrationLab
    uses: ./.github/workflows/calibrationlab.yml

  compilerlab:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.compilerlab == 'true'
    name: CompilerLab
    uses: ./.github/workflows/compilerlab.yml

  rogue-survivor:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rogue_survivor == 'true'
    name: RogueSurvivor
    uses: ./.github/workflows/rogue-survivor.yml

  mahjong:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.mahjong == 'true'
    name: Mahjong
    uses: ./.github/workflows/mahjong.yml

  required:
    name: CI required
    if: always()
    needs: [changes, privacy, reposcope, layout, constraintlab, qq-mail-mcp, entropylab, compressionlab, matchuplab, causallab, modelchecklab, synthlab, adversarylab, deltalab, agenttrustlab, calibrationlab, compilerlab, rogue-survivor, mahjong]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ALL_CHANGED: ${{ needs.changes.outputs.all }}
          MAHJONG_RESULT: ${{ needs.mahjong.result }}
          MAHJONG_CHANGED: ${{ needs.changes.outputs.mahjong }}
          ROGUE_SURVIVOR_RESULT: ${{ needs.rogue-survivor.result }}
          ROGUE_SURVIVOR_CHANGED: ${{ needs.changes.outputs.rogue_survivor }}
          COMPILERLAB_RESULT: ${{ needs.compilerlab.result }}
          COMPILERLAB_CHANGED: ${{ needs.changes.outputs.compilerlab }}
          CALIBRATIONLAB_RESULT: ${{ needs.calibrationlab.result }}
          CALIBRATIONLAB_CHANGED: ${{ needs.changes.outputs.calibrationlab }}
          AGENTTRUSTLAB_RESULT: ${{ needs.agenttrustlab.result }}
          AGENTTRUSTLAB_CHANGED: ${{ needs.changes.outputs.agenttrustlab }}
          DELTALAB_RESULT: ${{ needs.deltalab.result }}
          DELTALAB_CHANGED: ${{ needs.changes.outputs.deltalab }}
          ADVERSARYLAB_RESULT: ${{ needs.adversarylab.result }}
          ADVERSARYLAB_CHANGED: ${{ needs.changes.outputs.adversarylab }}
          SYNTHLAB_RESULT: ${{ needs.synthlab.result }}
          SYNTHLAB_CHANGED: ${{ needs.changes.outputs.synthlab }}
          MODELCHECKLAB_RESULT: ${{ needs.modelchecklab.result }}
          MODELCHECKLAB_CHANGED: ${{ needs.changes.outputs.modelchecklab }}
          CAUSALLAB_RESULT: ${{ needs.causallab.result }}
          CAUSALLAB_CHANGED: ${{ needs.changes.outputs.causallab }}
          MATCHUPLAB_RESULT: ${{ needs.matchuplab.result }}
          MATCHUPLAB_CHANGED: ${{ needs.changes.outputs.matchuplab }}
          ENTROPYLAB_RESULT: ${{ needs.entropylab.result }}
          ENTROPYLAB_CHANGED: ${{ needs.changes.outputs.entropylab }}
          COMPRESSIONLAB_RESULT: ${{ needs.compressionlab.result }}
          COMPRESSIONLAB_CHANGED: ${{ needs.changes.outputs.compressionlab }}
          QQ_MAIL_MCP_RESULT: ${{ needs.qq-mail-mcp.result }}
          QQ_MAIL_MCP_CHANGED: ${{ needs.changes.outputs.qq_mail_mcp }}
          PRIVACY_RESULT: ${{ needs.privacy.result }}
          REPOSCOPE_RESULT: ${{ needs.reposcope.result }}
          REPOSCOPE_CHANGED: ${{ needs.changes.outputs.reposcope }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          HAS_CONSTRAINTLAB: ${{ needs.layout.outputs.constraintlab }}
          CONSTRAINTLAB_RESULT: ${{ needs.constraintlab.result }}
          CONSTRAINTLAB_CHANGED: ${{ needs.changes.outputs.constraintlab }}
        run: |
          set -eu
          test "$CHANGES_RESULT" = success
          test "$PRIVACY_RESULT" = success
          test "$LAYOUT_RESULT" = success

          require_project() {
            name="$1"
            result="$2"
            changed="$3"
            if test "$ALL_CHANGED" = true || test "$changed" = true; then
              if test "$result" != success; then
                echo "$name was required but finished as $result"
                return 1
              fi
            else
              if test "$result" != skipped; then
                echo "$name was not selected but finished as $result"
                return 1
              fi
            fi
          }

          require_project "RepoScope" "$REPOSCOPE_RESULT" "$REPOSCOPE_CHANGED"
          require_project "QQ Mail MCP" "$QQ_MAIL_MCP_RESULT" "$QQ_MAIL_MCP_CHANGED"
          require_project "EntropyLab" "$ENTROPYLAB_RESULT" "$ENTROPYLAB_CHANGED"
          require_project "CompressionLab" "$COMPRESSIONLAB_RESULT" "$COMPRESSIONLAB_CHANGED"
          require_project "MatchupLab" "$MATCHUPLAB_RESULT" "$MATCHUPLAB_CHANGED"
          require_project "CausalLab" "$CAUSALLAB_RESULT" "$CAUSALLAB_CHANGED"
          require_project "ModelCheckLab" "$MODELCHECKLAB_RESULT" "$MODELCHECKLAB_CHANGED"
          require_project "SynthLab" "$SYNTHLAB_RESULT" "$SYNTHLAB_CHANGED"
          require_project "AdversaryLab" "$ADVERSARYLAB_RESULT" "$ADVERSARYLAB_CHANGED"
          require_project "DeltaLab" "$DELTALAB_RESULT" "$DELTALAB_CHANGED"
          require_project "AgentTrustLab" "$AGENTTRUSTLAB_RESULT" "$AGENTTRUSTLAB_CHANGED"
          require_project "CalibrationLab" "$CALIBRATIONLAB_RESULT" "$CALIBRATIONLAB_CHANGED"
          require_project "CompilerLab" "$COMPILERLAB_RESULT" "$COMPILERLAB_CHANGED"
          require_project "RogueSurvivor" "$ROGUE_SURVIVOR_RESULT" "$ROGUE_SURVIVOR_CHANGED"
          require_project "Mahjong" "$MAHJONG_RESULT" "$MAHJONG_CHANGED"

          if test "$HAS_CONSTRAINTLAB" = true; then
            require_project "ConstraintLab" "$CONSTRAINTLAB_RESULT" "$CONSTRAINTLAB_CHANGED"
          else
            test "$CONSTRAINTLAB_RESULT" = skipped
          fi
