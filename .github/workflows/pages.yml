name: GitHub Pages

# Single aggregate Pages site. Add future static projects to _site/<slug>/ here
# instead of introducing another deploy-pages workflow that replaces the site.
on:
  push:
    branches: [main]
    paths: ['projects/entropylab/**', 'projects/roguelab/**', 'projects/RogueSurvivor/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      auto_deploy: ${{ steps.changed.outputs.game }}
    defaults:
      run:
        working-directory: projects/entropylab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect authorized game changes
        id: changed
        working-directory: .
        run: |
          if [ -n "$(git diff --name-only HEAD^ HEAD -- projects/RogueSurvivor/)" ]; then
            echo 'game=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/entropylab/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/roguelab-tools
          key: roguelab-godot-4.6.3-${{ runner.os }}-v1
      - name: Install verified RogueLab toolchain
        working-directory: .
        run: python projects/roguelab/tools/setup_godot.py --directory "$RUNNER_TEMP/roguelab-tools" --templates
      - name: Build and validate RogueLab
        working-directory: .
        run: |
          python projects/roguelab/tools/verify.py --export
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python projects/roguelab/tests/web_smoke.py
      - name: Build and validate RogueSurvivor
        working-directory: projects/RogueSurvivor
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Assemble project site
        working-directory: .
        run: |
          mkdir -p _site/entropylab _site/roguelab _site/RogueSurvivor
          cp -R projects/entropylab/dist/. _site/entropylab/
          cp -R projects/roguelab/build/web/. _site/roguelab/
          cp -R projects/RogueSurvivor/dist/. _site/RogueSurvivor/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT 项目</title><h1>交互实验</h1><p><a href="./entropylab/">EntropyLab · 计算物理实验室</a></p><p><a href="./roguelab/">RogueLab · 深井协议 / 卡组肉鸽</a></p><p><a href="./RogueSurvivor/">星烬远征 / 俯视角动作肉鸽</a></p></html>
          HTML
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    # This project is authorized for automatic Pages deployment; preserve all projects.
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.auto_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy aggregate site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
