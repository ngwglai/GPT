name: Bili Observer
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Bili Observer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/bili-observer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/bili-observer/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m py_compile scripts/configure.py
